# Checks on every push and pull request. The deploy workflow ({{WORKFLOW_FILE}}, from
# {{DEPLOY_FEATURE}}) runs the same checks again before it ships.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: {{CHECKS_TIMEOUT}}
    steps:
      - uses: actions/checkout@v4
{{#NODE}}
      - uses: actions/setup-node@v4
        with:
          node-version: "{{NODE_VERSION}}"
          cache: npm
{{/NODE}}
{{#ANDROID}}
      # android/: JDK 21 for Gradle's daemon and toolchain; the runner image has the Android SDK
      # and AGP fetches any missing platform. setup-gradle caches and validates the wrapper.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
{{/ANDROID}}
      - name: install
        run: {{INSTALL_CMD}}
{{CHECKS_YAML}}
